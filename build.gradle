plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- Identifiants de signature (optionnels) ---
// Source 1 : fichier keystore.properties à la racine (builds locaux).
// Source 2 : variables d'environnement (CI : KEYSTORE_FILE, KEYSTORE_PASSWORD,
//            KEY_ALIAS, KEY_PASSWORD).
// Si aucune source n'est présente, le build release reste non signé (mais compile).
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystoreProps = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystoreProps) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def ksFile        = hasKeystoreProps ? keystoreProps['storeFile']     : System.getenv('KEYSTORE_FILE')
def ksPassword    = hasKeystoreProps ? keystoreProps['storePassword'] : System.getenv('KEYSTORE_PASSWORD')
def ksKeyAlias    = hasKeystoreProps ? keystoreProps['keyAlias']      : System.getenv('KEY_ALIAS')
def ksKeyPassword = hasKeystoreProps ? keystoreProps['keyPassword']   : System.getenv('KEY_PASSWORD')
def canSign = ksFile && ksPassword && ksKeyAlias && ksKeyPassword

android {
    namespace 'com.example.antitheft'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.antitheft"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (canSign) {
            release {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // JavaMail embarque des fichiers META-INF qui peuvent entrer en conflit au packaging.
    packaging {
        resources.excludes += [
            "META-INF/DEPENDENCIES",
            "META-INF/LICENSE",
            "META-INF/LICENSE.txt",
            "META-INF/NOTICE",
            "META-INF/NOTICE.txt"
        ]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Capture photo en arrière-plan (CameraX)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.3'

    // Envoi d'e-mail (SMTP) avec pièce jointe
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
