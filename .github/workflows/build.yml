name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # nÃ©cessaire pour crÃ©er la Release GitHub

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Reconstitue le keystore depuis le secret base64 dans app/keystore.jks
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: keystore.jks            # rÃ©solu relativement au dossier app/
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            --title "AntiTheft ${GITHUB_REF_NAME}" \
            --generate-notes

      # SÃ©curitÃ© : on supprime le keystore reconstituÃ© du runner
      - name: Cleanup keystore
        if: always()
        run: rm -f app/keystore.jks
