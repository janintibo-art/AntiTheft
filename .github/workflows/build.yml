name: Build APK (debug)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VÃ©rifie que le projet est bien Ã  la racine du dÃ©pÃ´t.
      - name: VÃ©rifier la structure du projet
        run: |
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Dossier 'app/' introuvable Ã  la racine du dÃ©pÃ´t."
            echo "On doit voir app/, settings.gradle, .github/ Ã  la racine."
            echo "----- Contenu actuel de la racine : -----"
            ls -la
            exit 1
          fi
          echo "Structure OK : 'app/' trouvÃ©."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installe Gradle 8.7 : pas besoin du wrapper jar committÃ©.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antitheft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
