name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # nÃ©cessaire pour crÃ©er la Release GitHub

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VÃ©rifie que le projet est bien Ã  la racine du dÃ©pÃ´t (et pas dans un sous-dossier).
      - name: VÃ©rifier la structure du projet
        run: |
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Dossier 'app/' introuvable Ã  la racine du dÃ©pÃ´t."
            echo "Le code doit Ãªtre Ã  la racine : on doit voir app/, settings.gradle, .github/ ..."
            echo "Si tout est dans un sous-dossier (ex : AntiTheftApp/), dÃ©place-le Ã  la racine."
            echo "----- Contenu actuel de la racine du dÃ©pÃ´t : -----"
            ls -la
            exit 1
          fi
          echo "Structure OK : 'app/' trouvÃ© Ã  la racine."

      # VÃ©rifie que les 4 secrets de signature sont dÃ©finis, avec un message clair sinon.
      - name: VÃ©rifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) manquant(s) :$missing"
            echo "Ajoute-les dans : Settings â†’ Secrets and variables â†’ Actions â†’ New repository secret."
            echo "  - KEYSTORE_BASE64   : ton .jks encodÃ© (base64 -w0 antitheft-release.jks)"
            echo "  - KEYSTORE_PASSWORD : mot de passe du keystore"
            echo "  - KEY_ALIAS         : antitheft"
            echo "  - KEY_PASSWORD      : mot de passe de la clÃ©"
            exit 1
          fi
          echo "Les 4 secrets de signature sont prÃ©sents."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Reconstitue le keystore depuis le secret base64 dans app/keystore.jks
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Le keystore dÃ©codÃ© est vide. VÃ©rifie le contenu du secret KEYSTORE_BASE64."
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: keystore.jks            # rÃ©solu relativement au dossier app/
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            --title "AntiTheft ${GITHUB_REF_NAME}" \
            --generate-notes

      # SÃ©curitÃ© : on supprime le keystore reconstituÃ© du runner
      - name: Cleanup keystore
        if: always()
        run: rm -f app/keystore.jks
