name: Build APK (depuis le zip)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub ne dÃ©compresse pas le zip : on le fait ici.
      - name: DÃ©compresser le projet depuis le zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier .zip trouvÃ© Ã  la racine du dÃ©pÃ´t."
            echo "Envoie AntiTheftApp.zip Ã  la racine, puis relance."
            ls -la
            exit 1
          fi
          echo "Zip trouvÃ© : $ZIP"
          unzip -o "$ZIP" -d _extracted >/dev/null

          SETTINGS=$(find _extracted -name "settings.gradle*" | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le zip (zip incomplet ?)."
            find _extracted -maxdepth 2 -type f
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Projet dÃ©tectÃ© dans : $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antitheft-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
